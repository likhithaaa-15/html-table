<!DOCTYPE html>
<html>

<head>
    <title>HTML Tables</title>
</head>

<body>

    <h1>Subjects Score</h1>

    <table border="1">

        <tr>
            <th>Subjects</th>
            <th>Score</th>
        </tr>

        <tr>
            <td>Mathematics</td>
            <td>30/40</td>
        </tr>

        <tr>
            <td>JavaScript</td>
            <td>34/40</td>
        </tr>

    </table>

</body>

</html>
